<text x="38.4" y="138.5" font-size="3.2" text-anchor="start" fill="#1b7a3d" font-weight="bold">Feuchtesensor (SHT40)</text>
<text x="38.4" y="142.9" font-size="2.6" text-anchor="start" fill="#1b7a3d">in der offenen Sensorkammer</text>
<line x1="129.5" y1="173.0" x2="149.5" y2="155.8" stroke="#1b7a3d" stroke-width="0.6" stroke-dasharray="1.6 1.2"/>
