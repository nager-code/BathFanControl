<text x="15.0" y="212.2" font-size="2.8" text-anchor="middle" fill="#222" font-weight="bold" transform="rotate(-90 15.0 212.2)">77,1 mm</text>
<text x="289.8" y="30.0" font-size="3.5" text-anchor="start" fill="#222" font-weight="bold">Warum dort</text>
<text x="289.8" y="36.6" font-size="2.9" text-anchor="start" fill="#222">Der Sensor sitzt in der oberen rechten</text>
<text x="289.8" y="41.2" font-size="2.9" text-anchor="start" fill="#222">Ecke des Gehäuses, der Ansaugöffnung</text>
<text x="289.8" y="45.9" font-size="2.9" text-anchor="start" fill="#222">zugewandt. Die Badluft streicht auf dem</text>
<text x="289.8" y="50.5" font-size="2.9" text-anchor="start" fill="#222">Weg zum Lüfter an ihm vorbei.</text>
<text x="289.8" y="58.2" font-size="3.5" text-anchor="start" fill="#1b7a3d" font-weight="bold">Sensorkammer</text>
<text x="289.8" y="64.8" font-size="2.9" text-anchor="start" fill="#222">Schraffiert: der einzige offene Teil</text>
<text x="289.8" y="69.4" font-size="2.9" text-anchor="start" fill="#222">des Gehäuses. Sie ist vom Raum mit</text>
<text x="289.8" y="74.0" font-size="2.9" text-anchor="start" fill="#222">Netzteil und Elektronik abgeschottet.</text>
<text x="289.8" y="81.7" font-size="3.5" text-anchor="start" fill="#d07000" font-weight="bold">Genauigkeit</text>
<text x="289.8" y="88.3" font-size="2.9" text-anchor="start" fill="#222">Gehäuse und freier Raum: gemessen.</text>
<text x="289.8" y="92.9" font-size="2.9" text-anchor="start" fill="#222">Ansaugöffnung, Wartungsöffnung und</text>
<text x="289.8" y="97.6" font-size="2.9" text-anchor="start" fill="#222">Kabeltasche: aus einem Foto geschätzt,</text>
<text x="289.8" y="102.2" font-size="2.9" text-anchor="start" fill="#222">etwa ±10 %.</text>
