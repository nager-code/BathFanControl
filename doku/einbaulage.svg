<line x1="26.0" y1="279.7" x2="26.0" y2="283.3" stroke="#222" stroke-width="0.4"/>
<line x1="138.5" y1="279.7" x2="138.5" y2="283.3" stroke="#222" stroke-width="0.4"/>
<text x="82.3" y="286.1" font-size="2.8" text-anchor="middle" fill="#222" font-weight="bold">72,6 mm</text>
<line x1="17.0" y1="272.0" x2="17.0" y2="152.5" stroke="#222" stroke-width="0.4"/>
